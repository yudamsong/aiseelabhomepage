<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
</helmet>
<div style="max-width:1520px;margin:0 auto;padding:84px 48px;font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-0.01em;">
  <h2 style="font-weight:700;color:#191F28;font-size:42px;margin-bottom:44px;letter-spacing:.3px;">{{ title }}</h2>
  <div style="display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;">

    <div style="display:flex;gap:16px;flex-shrink:0;">
      <div style="display:flex;flex-direction:column;gap:16px;">
        <sc-for list="{{ col1 }}" as="m" hint-placeholder-count="2">
          <div style="{{ m.cardStyle }}" onClick="{{ m.onClick }}" onMouseEnter="{{ m.onEnter }}" onMouseLeave="{{ m.onLeave }}">
            <img src="{{ m.img }}" alt="{{ m.name }}" style="{{ m.imgStyle }}">
          </div>
        </sc-for>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;margin-top:86px;">
        <sc-for list="{{ col2 }}" as="m" hint-placeholder-count="2">
          <div style="{{ m.cardStyle }}" onClick="{{ m.onClick }}" onMouseEnter="{{ m.onEnter }}" onMouseLeave="{{ m.onLeave }}">
            <img src="{{ m.img }}" alt="{{ m.name }}" style="{{ m.imgStyle }}">
          </div>
        </sc-for>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;margin-top:40px;">
        <sc-for list="{{ col3 }}" as="m" hint-placeholder-count="2">
          <div style="{{ m.cardStyle }}" onClick="{{ m.onClick }}" onMouseEnter="{{ m.onEnter }}" onMouseLeave="{{ m.onLeave }}">
            <img src="{{ m.img }}" alt="{{ m.name }}" style="{{ m.imgStyle }}">
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:26px;flex:0 1 260px;min-width:236px;padding-top:8px;">
      <sc-for list="{{ rows }}" as="m" hint-placeholder-count="6">
        <div style="{{ m.rowStyle }}" onClick="{{ m.onClick }}" onMouseEnter="{{ m.onEnter }}" onMouseLeave="{{ m.onLeave }}">
          <div style="display:flex;align-items:center;gap:12px;">
            <span style="{{ m.barStyle }}"></span>
            <span style="{{ m.nameStyle }}">{{ m.name }}</span>
            <span onClick="{{ m.onMailClick }}" title="Email" style="{{ m.mailStyle }}">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 5L2 7"></path></svg>
            </span>
            <sc-if value="{{ m.showEmail }}" hint-placeholder-val="{{ false }}">
              <a href="{{ m.mailto }}" onClick="{{ m.stop }}" style="{{ m.emailBubbleStyle }}">{{ m.email }}</a>
            </sc-if>
          </div>
          <p style="{{ m.roleStyle }}">{{ m.role }}</p>
        </div>
      </sc-for>
    </div>

    <div style="flex:1 1 300px;min-width:280px;padding-top:8px;">
      <sc-if value="{{ hasFocus }}" hint-placeholder-val="{{ false }}">
        <div style="border:1px solid #E5E8EB;border-radius:22px;padding:34px 36px 36px;background:#FAFBFC;">
          <span style="font-size:13px;font-weight:700;letter-spacing:.2em;color:#1B3A6B;">RESEARCH</span>
          <p style="margin-top:14px;font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#191F28;">{{ focusName }}</p>
          <p style="margin-top:16px;font-size:19px;line-height:1.65;color:#333D4B;text-wrap:pretty;">{{ focusKo }}</p>
          <p style="margin-top:12px;font-size:16px;line-height:1.6;color:#8B95A1;text-wrap:pretty;">{{ focusEn }}</p>
        </div>
      </sc-if>
      <sc-if value="{{ noFocus }}" hint-placeholder-val="{{ true }}">
        <div style="border:1px dashed #E5E8EB;border-radius:22px;padding:34px 36px;">
          <p style="font-size:17px;line-height:1.6;color:#8B95A1;">이름을 클릭하면 연구 주제를 볼 수 있습니다.</p>
        </div>
      </sc-if>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:520},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Members&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;list&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{name:string;role:string;img:string;email?:string}&gt;&quot;}}">
class Component extends DCLogic {
  state = { hoveredId: null, shownId: null, activeId: null };
  renderVals() {
    const list = this.props.list || [];
    const h = this.state.hoveredId;
    const sizes = [ {w:200,ht:213}, {w:222,ht:235}, {w:209,ht:222} ];
    const decorate = (m, i) => {
      const uid = (m.name || '') + '-' + i;
      const isHover = h === uid;
      const isClicked = this.state.activeId === uid;
      const isActive = isHover || isClicked;
      const isDimmed = h !== null && !isActive;
      const isShown = this.state.shownId === uid;
      const s = sizes[i % 3];
      return {
        img: m.img, name: m.name, role: m.role,
        mailto: m.email ? ('mailto:' + m.email) : '#',
        cardStyle: { width: s.w + 'px', height: s.ht + 'px', overflow:'hidden', borderRadius:'14px', cursor:'pointer', flexShrink:0, transition:'opacity .4s ease, transform .4s ease, box-shadow .4s ease', opacity: isDimmed ? 0.6 : 1, transform: isClicked ? 'scale(1.12)' : 'scale(1)', boxShadow: isClicked ? '0 12px 28px rgba(25,31,40,.24)' : 'none', position: isClicked ? 'relative' : 'static', zIndex: isClicked ? 5 : 'auto' },
        imgStyle: { width:'100%', height:'100%', objectFit:'cover', display:'block', transition:'filter .5s ease', filter: isClicked ? 'grayscale(0) brightness(1.12) contrast(1.03)' : 'grayscale(0) brightness(1)' },
        rowStyle: { cursor:'pointer', transition:'opacity .3s ease', opacity: isDimmed ? 0.5 : 1 },
        barStyle: { width: isActive ? '25px' : '20px', height:'15px', borderRadius:'6px', flexShrink:0, transition:'all .3s ease', background: isActive ? '#1B3A6B' : 'rgba(27,29,34,0.25)' },

        nameStyle: { fontSize:'22px', fontWeight:600, lineHeight:1.1, letterSpacing:'-0.01em', transition:'color .3s ease', color: isActive ? '#191F28' : 'rgba(27,29,34,0.8)' },
        roleStyle: { marginTop:'7px', paddingLeft:'34px', fontSize:'12px', fontWeight:500, textTransform:'uppercase', letterSpacing:'0.2em', color:'#8B95A1' },
        mailStyle: { display:'inline-flex', alignItems:'center', color: isShown ? '#3F4391' : '#1B3A6B', marginLeft:'2px', cursor:'pointer', transition:'all .2s ease', opacity: (m.email && (isActive || isShown)) ? 1 : 0, transform: (isActive || isShown) ? 'translateX(0)' : 'translateX(-8px)', pointerEvents: (m.email && (isActive || isShown)) ? 'auto' : 'none' },
        email: m.email || '',
        showEmail: isShown,
        emailBubbleStyle: { fontSize:'15px', color:'#4D5159', background:'#F2F4F6', border:'1px solid #E5E8EB', borderRadius:'9999px', padding:'4px 14px', whiteSpace:'nowrap', textDecoration:'none' },
        onMailClick: (e) => { e.preventDefault(); e.stopPropagation(); this.setState(st => ({ shownId: st.shownId === uid ? null : uid })); },
        stop: (e) => e.stopPropagation(),
        onClick: () => this.setState(st => ({ activeId: st.activeId === uid ? null : uid })),
        onEnter: () => this.setState({ hoveredId: uid }),
        onLeave: () => this.setState({ hoveredId: null })
      };
    };
    const d = list.map(decorate);
    const focusUid = this.state.activeId || this.state.hoveredId;
    const focus = focusUid ? list.find((m, i) => ((m.name || '') + '-' + i) === focusUid) : null;
    return {
      hasFocus: !!(focus && focus.researchKo),
      noFocus: !(focus && focus.researchKo),
      focusName: focus ? focus.name : '',
      focusKo: focus ? focus.researchKo : '',
      focusEn: focus ? focus.researchEn : '',
      title: this.props.title,
      rows: d,
      col1: d.filter((_, i) => i % 3 === 0),
      col2: d.filter((_, i) => i % 3 === 1),
      col3: d.filter((_, i) => i % 3 === 2)
    };
  }
}
</script>
</body>
</html>
