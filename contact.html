<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; letter-spacing:-0.01em; color:#191F28; background:#fff; }
  a { color:inherit; text-decoration:none; }
  a:hover { color:#1B3A6B; }
  .section-h { font-weight:700; color:#191F28; letter-spacing:-0.03em; }
  @keyframes tds-toast-in { from { opacity:0; transform:translate(-50%,16px) } to { opacity:1; transform:translate(-50%,0) } }
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;">
  <dc-import name="SiteHeader" active="contact" hint-size="100%,82px"></dc-import>
  <main style="flex:1;">

    <section style="position:relative;">
      <img src="https://static.wixstatic.com/media/11062b_8f5bd2606d804635891c69668f29e855~mv2_d_6000_4000_s_4_2.jpg/v1/fill/w_1480,h_620,al_c,q_85,enc_avif,quality_auto/11062b_8f5bd2606d804635891c69668f29e855~mv2_d_6000_4000_s_4_2.jpg" alt="위성" class="m-hero-img" style="width:100%;height:560px;object-fit:cover;display:block;">
      <div style="position:absolute;inset:0;background:rgba(15,25,40,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px;color:#fff;">
        <h2 class="section-h" style="font-size:38px;line-height:1.2;max-width:820px;text-wrap:balance;color:#fff;">If you are interested in AI SEE Lab, please contact us below.</h2>
        <div style="margin-top:26px;font-size:17px;line-height:1.9;">
          <div>Jeonbuk National University</div>
          <div>Building 15-4, Rooms 207, 208, 214, 225</div>
          <div><a href="mailto:jmyeom@jbnu.ac.kr" onClick="{{ copyEmail }}" style="color:#cfe0f0;cursor:pointer;">jmyeom@jbnu.ac.kr</a></div>
          <div>063-270-3350</div>
        </div>
        <div style="margin-top:28px;display:flex;align-items:center;gap:14px;padding:10px 16px 10px 10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:16px;color:#fff;text-align:left;">
          <span style="width:84px;height:84px;background:#fff;border-radius:10px;padding:4px;flex-shrink:0;display:block;">
            <sc-if value="{{ hasQr }}" hint-placeholder-val="{{ false }}">
              <img src="{{ qrSrc }}" alt="QR" style="width:100%;height:100%;image-rendering:pixelated;display:block;">
            </sc-if>
          </span>
          <span style="display:flex;flex-direction:column;gap:4px;">
            <span style="font-size:13px;color:#cfe0f0;">Lab mini-game</span>
            <a href="https://whykevin-cloud.github.io/mallab/" target="_blank" style="font-size:17px;font-weight:700;color:#fff;text-decoration:underline;text-underline-offset:4px;cursor:pointer;" style-hover="color:#cfe0f0;">Malang Malang Weather Factory ↗</a>
            <span style="font-size:13px;color:#e6eef6;">Scan with your phone camera to play</span>
          </span>
        </div>
      </div>
    </section>

  </main>
  <dc-import name="SiteFooter" hint-size="100%,90px"></dc-import>

  <sc-if value="{{ toastMsg }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:300;background:#191F28;color:#fff;font-size:15px;font-weight:600;padding:15px 22px;border-radius:14px;box-shadow:0 8px 24px rgba(25,31,40,.16);display:flex;align-items:center;gap:10px;animation:tds-toast-in .32s cubic-bezier(0.16,1,0.3,1);">
      <span style="width:20px;height:20px;border-radius:999px;background:#12B886;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;">✓</span>
      {{ toastMsg }}
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { toastMsg: null, qrSrc: '' };
  componentDidMount() { this.makeQr(); }
  componentWillUnmount() { clearTimeout(this._q); }
  makeQr() {
    if (!window.qrcode) { this._q = setTimeout(() => this.makeQr(), 150); return; }
    const url = 'https://whykevin-cloud.github.io/mallab/';
    const q = window.qrcode(0, 'M'); q.addData(url); q.make();
    const n = q.getModuleCount(), m = 2, s = 8, cv = document.createElement('canvas');
    cv.width = cv.height = (n + m * 2) * s;
    const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.fillStyle = '#191F28';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + m) * s, (r + m) * s, s, s);
    this.setState({ qrSrc: cv.toDataURL('image/png') });
  }
  showToast(msg) { clearTimeout(this._t); this.setState({ toastMsg: msg }); this._t = setTimeout(() => this.setState({ toastMsg: null }), 2200); }
  renderVals() {
    return {
      toastMsg: this.state.toastMsg,
      qrSrc: this.state.qrSrc, hasQr: !!this.state.qrSrc,
      copyEmail: (e) => { e.preventDefault(); try { navigator.clipboard.writeText('jmyeom@jbnu.ac.kr'); } catch(x){} this.showToast('이메일을 복사했어요'); }
    };
  }
}
</script>
</body>
</html>
