<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; letter-spacing:-0.01em; color:#191F28; background:#fff; }
  a { color:inherit; text-decoration:none; }
  a:hover { color:#1B3A6B; }
  .section-h { font-weight:700; color:#191F28; letter-spacing:-0.03em; }
  @keyframes tds-scrim { from { opacity:0 } to { opacity:1 } }
  @keyframes tds-sheet-up { from { transform:translateY(100%) } to { transform:translateY(0) } }
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;">
  <dc-import name="SiteHeader" active="broad" hint-size="100%,82px"></dc-import>
  <main style="flex:1;">
    <section style="max-width:1100px;margin:0 auto;padding:72px 48px 88px;">
      <h2 class="section-h" style="font-size:34px;margin-bottom:24px;">Broad</h2>
      <div style="display:inline-flex;gap:4px;padding:4px;background:#F2F4F6;border-radius:14px;margin-bottom:36px;">
        <sc-for list="{{ broadTabs }}" as="t" hint-placeholder-count="3">
          <span onClick="{{ t.onClick }}" style="{{ t.style }}">{{ t.label }}</span>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:32px 28px;">
        <sc-for list="{{ filteredNews }}" as="item" hint-placeholder-count="3">
          <div onClick="{{ item.onOpen }}" style="display:flex;flex-direction:column;background:#fff;border:1px solid #E5E8EB;border-radius:20px;overflow:hidden;box-shadow:0px 5px 10px rgba(0,0,0,0.06);cursor:pointer;">
            <img src="{{ item.img }}" alt="{{ item.title }}" style="width:100%;aspect-ratio:4/3;object-fit:cover;background:#F2F4F6;display:block;">
            <div style="display:flex;flex-direction:column;gap:10px;padding:20px 22px 24px;">
              <span style="font-size:17px;font-weight:700;line-height:1.4;color:#191F28;text-wrap:pretty;">{{ item.title }}</span>
              <span style="font-size:14px;color:#8B95A1;">{{ item.date }}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,90px"></dc-import>

  <sc-if value="{{ postOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closePost }}" style="position:fixed;inset:0;background:rgba(0,0,0,0.56);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:tds-scrim .2s ease;">
      <div onClick="{{ stopProp }}" style="background:#fff;border-radius:24px 24px 0 0;max-width:720px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 -2px 12px rgba(25,31,40,.06);animation:tds-sheet-up .32s cubic-bezier(0.22,0.61,0.36,1);">
        <div style="position:sticky;top:0;background:#fff;padding:12px 0 6px;display:flex;justify-content:center;z-index:2;">
          <div style="width:44px;height:5px;border-radius:999px;background:#E5E8EB;"></div>
        </div>
        <div style="padding:8px 30px 6px;">
          <div style="font-size:14px;color:#8B95A1;">{{ openDate }}</div>
          <h3 class="section-h" style="font-size:24px;margin-top:8px;line-height:1.35;text-wrap:pretty;">{{ openTitle }}</h3>
        </div>
        <sc-if value="{{ singleImg }}" hint-placeholder-val="{{ true }}">
          <img src="{{ openImgFull }}" alt="{{ openTitle }}" onClick="{{ openLightbox }}" data-src="{{ openImgFull }}" style="width:100%;max-height:none;object-fit:contain;display:block;background:#F2F4F6;margin-top:14px;cursor:zoom-in;">
        </sc-if>
        <sc-if value="{{ hasGallery }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 30px 4px;">
            <sc-for list="{{ openGallery }}" as="g" hint-placeholder-count="6">
              <img src="{{ g }}" alt="{{ openTitle }}" onClick="{{ openLightbox }}" data-src="{{ g }}" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:#F2F4F6;display:block;cursor:zoom-in;">
            </sc-for>
          </div>
        </sc-if>
        <div style="padding:18px 30px 34px;">
          <sc-if value="{{ hasBody }}" hint-placeholder-val="{{ true }}">
            <p style="font-size:15px;line-height:1.75;color:#4E5968;white-space:pre-line;text-wrap:pretty;">{{ openBody }}</p>
          </sc-if>
          <div onClick="{{ closePost }}" style="margin-top:26px;height:56px;display:flex;align-items:center;justify-content:center;background:#1B3A6B;color:#fff;font-weight:700;font-size:17px;border-radius:999px;cursor:pointer;">닫기</div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ lightboxImg }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeLightbox }}" style="position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:210;display:flex;align-items:center;justify-content:center;padding:32px;cursor:zoom-out;">
      <img src="{{ lightboxImg }}" alt="" style="max-width:100%;max-height:100%;object-fit:contain;display:block;">
      <span onClick="{{ closeLightbox }}" style="position:absolute;top:20px;right:28px;color:#fff;font-size:34px;line-height:1;cursor:pointer;">×</span>
      <sc-if value="{{ lightboxHasNav }}" hint-placeholder-val="{{ true }}">
        <span onClick="{{ prevLightbox }}" style="position:absolute;left:20px;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;">‹</span>
        <span onClick="{{ nextLightbox }}" style="position:absolute;right:20px;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;">›</span>
        <span style="position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.82);font-size:14px;letter-spacing:.02em;">{{ lightboxCounter }}</span>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>

      '2025 ISRS 학회 참석 및 포스터 발표': '2025.05.14~2025.05.16 ISRS 학회 참석 (인천 송도 컨벤시아)\n\n#학회온김에화보찍기 #이과생의포즈\n\n· 포스터 발표 (5.14): RESEARCH AND TECHNOLOGY OF ALGORITHMS FOR THE CALCULATION OF SURFACE REFLECTANCE THROUGH MULTI-SATELLITE DATA FUSION\n· 포스터 발표 (5.15): CLOUD DETECTION IMPROVEMENT AND EVALUATION USING KOMPSAT TOP OF ATMOSPHERE REFLECTANCE AND DEEPLABV3+ MODEL\n· 포스터 발표 (5.15): EVALUATION OF CHLOROPHYLL CONENTRATION IN SAMANGEUM WATERSHED USING GEOSTATIONARY OCEAN COLOR IMAGING SATELLITE AND BACK PROPAGATION NEURAL NETWORK(BPNN) MODEL\n\n#학회후퇴근길 #OralSession끝났으니노을세션시작\n#누가맥주에위성담갔냐 #맥주에데이터쌓이는중 #AI도못알아들을수다',
      '벚꽃보다 선명한 우리 연구실의 봄 🌸🛰️': '우리 연구실 감성, 벚꽃처럼 예쁘게 피었다는 거 인증 완료🌸🛰️✨\n\n#위성보다우리가선명함 #벚꽃아래위성데이터받기 #위성찍다우릴찍었네 #벚꽃다운로드중',
      '새로운 학부연구생 환영회': '인공지능 원격탐사 연구실 새 가족을 소개합니다!\n\n우리 연구실에 새로운 학부 연구생 두 분이 함께하게 되었습니다.\n\n지구환경과학과 22학번 송시은\n생물산업기계공학과 22학번 김윤지\n\n앞으로 다양한 연구 프로젝트에서 함께 성장하며 멋진 성과를 만들어가길 기대합니다. 환영회 겸 회식에서 다 같이 즐거운 시간을 보냈는데, 두 학생 모두 연구실 분위기에 잘 적응했길 바라며 연구실의 새로운 활력소가 되어줄 두 분을 진심으로 환영합니다!',
      '2025 AGU 학회 참석 및 포스터 발표': '2025.12.13~2025.12.21 2025 AGU 학회 참석 (미국 뉴올리언스)\n\n· 포스터 발표: Multi-Satellite-Based Image Fusion Methods Using Deep Learning\n· 포스터 발표: Fog Detection with Deep Learning and Pseudo Labeling on GEO-KOMPSAT-2A\n· 포스터 발표: Assessing Chlorophyll Concentration in Using Geostatonary Ocean Color Imager Satellite and Deep Learning approach: Case study of Reciamed Areas of Saemangeum Watershed\n· 포스터 발표: Deep Learning-Based Postprocessing of East Asian Summer Precipitation Forecasts for S2S Prediction Using Multiple Architectures, Loss Functions, and Ensemble Means',
      '2025 스페이스 해커톤 우수상 수상': '전북대학교 인공지능 환경원격탐사 연구실 석사과정생 전원이 2025 스페이스 해커톤에 참가해 ‘위성정보 빅데이터 활용 아이디어 공모 부문’에서 우수상을 수상했다.\n\n수상작은 KOMPSAT-3 위성 영상을 기반으로 PAN Sharpening 기법과 인공지능, 대규모 언어모델(LLM)을 결합한 건물 피해 탐지 및 시각적 추론 프레임워크로, 재난 상황에서의 신속한 피해 분석과 의사결정 지원 가능성을 제시했다.\n\n특히 대규모 위성영상 분석 결과를 언어모델과 연계해 피해 유형 분류와 요약 정보를 자동으로 생성하도록 설계함으로써, 재난 대응 기술의 실용성과 확장성을 높였다는 평가를 받았다.\n\n지도교수인 염종민 교수는 “고해상도 위성영상과 인공지능, 언어모델을 융합한 이번 연구는 위성정보 활용의 새로운 방향성을 보여준다”며, “학생들이 연구 과정에서 축적한 기술을 실제 문제 해결 중심의 아이디어로 발전시킨 점이 의미 있다”고 밝혔다.\n\n또한 수상팀은 “연구실에서 진행해 온 인공지능 기반 원격탐사 연구를 바탕으로 재난 대응에 실질적으로 기여할 수 있는 기술을 제안하고자 했다”며 “앞으로 모델 고도화와 다양한 위성 자료 확장을 통해 현장 적용 가능성을 높여 나가겠다”고 소감을 밝혔다.\n\n#2025스페이스해커톤 #미국진출 #위성의_미래는_밝다 📡🌟',
      '2025 GeoAI 추계학술대회 학생우수발표상 수상': '전북대학교 인공지능 환경원격탐사 연구실 한도희 석사과정생(지도교수 염종민)이 2025 GeoAI 추계학술대회에서 우수 학생연구 발표자로 선정되어 시상되었습니다!\n\n연구 주제: “딥러닝 및 물리모델을 활용한 다중위성 융합 기반 시·공간 초해상도 지표반사도 산출 기법”\n\n연구실 모든 구성원이 함께 축하드립니다 👏',
      '2025 GeoAI 학회 참석 및 구두 발표': '2025.11.05~2025.11.07 2025 GeoAI 추계학술대회 참석 (제주 파르나스 호텔)\n\n· 구두 발표: 딥러닝 및 물리모델을 활용한 다중위성 융합 기반 시·공간 초해상도 지표반사도 산출 기법\n· 구두 발표: GK2A와 지상관측 자료의 융합을 통한 한반도 안개 탐지 레이블 확장 연구\n· 구두 발표: 인공지능 기반 정지궤도 해색위성 자료를 통한 새만금 유역의 클로로필-a 및 TP 산출 연구',
      '2025 KSRS 학회 참석 및 포스터/구두 발표': '2025.10.23~2025.10.24 2025 대한원격탐사 추계학술대회(KSRS) 참석 (여수 베네치아 호텔)\n\n· 구두 발표 (10.23): 다중위성 기반 딥러닝 영상 융합반사도 산출 기법 연구\n· 구두 발표 (10.23): 정지궤도 위성자료와 인공지능을 활용한 새만금 유역 클로로필-a 산출 연구\n· 포스터 발표 (10.23): 공간정보 학술자료 기반 Qwen LLM 파인튜닝을 통한 챗봇 성능 개선 연구 — 위성기반 안개 탐지 사례\n· 구두 발표 (10.24): GK2A와 영상처리 기반 라벨 확장을 활용한 안개 탐지 기법 연구\n\n우수논문 심사상 — 전북대학교 염종민 교수님 축하드립니다! 🥳\n우리 연구실 교수님이 이번 추계학술대회 기술위원장 🤗✌️',
      '2025 새만금 공공데이터 활용 경진대회 우수상 수상': '전북대학교 인공지능 환경원격탐사 연구실 김수환, 한도희, 이예진 석사과정생(지도교수 염종민)이 ‘2025 새만금 공공데이터 활용 경진대회’에서 우수상을 수상했다.\n\n새만금개발청이 주최하는 「2025년 새만금 공공데이터 활용 경진대회」에서 전북대학교 조류감시단 팀이 데이터 분석 및 생산 부문 우수상을 수상했다.\n\n조류감시단은 ‘새만금 유역 수질 데이터 및 인공위성 자료 기반 AI를 활용한 새만금호 조류의 시공간적 변동 양상 분석’이라는 주제로 참가하여, 새만금호 유역 수질측정망 데이터·GOCI 위성영상·LDAPS 기상모델·배수갑문 해수유통량 자료를 융합 분석하였다. 이를 통해 AI 기반 클로로필 농도 예측 모델을 구축하고, 녹조 발생 가능성을 시공간적으로 정밀하게 추적할 수 있는 알고리즘을 개발하여 높은 평가를 받았다.\n\n특히 기존 수질 측정망의 한계를 극복하고 실시간 모니터링 체계로 확장할 수 있는 가능성을 제시했다는 점에서 기술적·실용적 가치가 높게 인정되었다. 이번 성과는 단순한 연구 성과를 넘어, 새만금 개발 정책과 환경 관리 정책에도 실질적으로 기여할 수 있는 성과라는 점에서 의미가 크다.\n\n수상팀은 “연구 과정에서 지도해주신 교수님과 협력해준 팀원들에게 깊이 감사드리며, 이번 연구가 원격탐사와 환경 분야 발전에 기여할 수 있기를 바란다”고 소감을 전했다.',
      '2026 EGU 학회 참석 및 포스터·구두 발표': '2026.05.03~2026.05.11 EGU 학회 참석 (오스트리아 빈)\n\n· 포스터 발표: Development of a Surface Reflectance Consistency Algorithm between KOMPSAT-3A and Sentinel-2A/Landsat Satellites\n· 포스터 발표: Environment-Specific Fog Detection over the Korean Peninsula Using GEO-KOMPSAT-2A and DeepLabv3+\n· 포스터 발표: Satellite-Based Estimation of Chlorophyll-a and Total Phosphorus in Saemangeum’s Hydrodynamically Complex Waters Using Machine and Deep Learning\n· 구두 발표: Solar Irradiation Nowcasting with Flow-Guided Cloud Motion',
