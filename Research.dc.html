<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; letter-spacing:-0.01em; color:#191F28; background:#fff; }
  a { color:inherit; text-decoration:none; }
  a:hover { color:#1B3A6B; }
  .section-h { font-weight:700; color:#191F28; letter-spacing:-0.03em; }
  @keyframes panel-in { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
  @keyframes beam-in { from { opacity:0; } to { opacity:1; } }
  @keyframes foot-pulse { 0%,100% { opacity:.16; } 50% { opacity:.34; } }
  @keyframes foot-ring { 0% { transform:scale(.7); opacity:.85; } 100% { transform:scale(1.25); opacity:0; } }
  @keyframes pin-ping { 0% { transform:scale(1); opacity:.75; } 70% { transform:scale(2.5); opacity:0; } 100% { transform:scale(2.5); opacity:0; } }
  @keyframes spin-slow { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  @keyframes beam { 0%,100% { opacity:.25; } 50% { opacity:.7; } }
  @keyframes drift { from { transform:translateX(0); } to { transform:translateX(26px); } }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  @keyframes shimmer { 0%,100% { opacity:.4; } 50% { opacity:.9; } }
  @keyframes sun-glow { 0%,100% { opacity:.22; transform:scale(1); } 50% { opacity:.45; transform:scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</helmet>

        <sc-if value="{{ beam }}" hint-placeholder-val="{{ false }}">
          <svg viewBox="0 0 1400 890" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;animation:beam-in .5s cubic-bezier(.2,.8,.2,1) both;">
            <defs>
              <linearGradient id="beamFade" x1="1" y1="0" x2="0" y2="0">
                <stop offset="0" stop-color="{{ beam.color }}" stop-opacity=".26"></stop>
                <stop offset=".55" stop-color="{{ beam.color }}" stop-opacity=".16"></stop>
                <stop offset="1" stop-color="{{ beam.color }}" stop-opacity=".015"></stop>
              </linearGradient>
              <linearGradient id="beamInnerFade" x1="1" y1="0" x2="0" y2="0">
                <stop offset="0" stop-color="#FFFFFF" stop-opacity=".3"></stop>
                <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
              </linearGradient>
            </defs>
            <sc-for list="{{ beam.cones }}" as="c" hint-placeholder-count="1">
              <polygon points="{{ c.outer }}" fill="url(#beamFade)"></polygon>
            </sc-for>
            <sc-for list="{{ beam.cones }}" as="c" hint-placeholder-count="1">
              <polygon points="{{ c.inner }}" fill="url(#beamInnerFade)"></polygon>
            </sc-for>
            <sc-for list="{{ beam.feet }}" as="f" hint-placeholder-count="1">
              <ellipse cx="{{ f.x }}" cy="{{ f.y }}" rx="{{ f.rx }}" ry="{{ f.ry }}" fill="{{ beam.color }}" opacity=".22" style="animation:foot-pulse 2.4s ease-in-out infinite;"></ellipse>
            </sc-for>
            <sc-for list="{{ beam.feet }}" as="f" hint-placeholder-count="1">
              <ellipse cx="{{ f.x }}" cy="{{ f.y }}" rx="{{ f.rx }}" ry="{{ f.ry }}" fill="none" stroke="{{ beam.color }}" stroke-width="2" opacity=".7" style="transform-box:fill-box;transform-origin:center;animation:foot-ring 2.4s ease-out infinite;"></ellipse>
            </sc-for>
          </svg>
        </sc-if>

        <sc-for list="{{ spots }}" as="s" hint-placeholder-count="4">
          <div style="{{ s.stemStyle }}"></div>
        </sc-for>

        <sc-for list="{{ spots }}" as="s" hint-placeholder-count="4">
          <span style="{{ s.dotStyle }}"><span style="{{ s.pingStyle }}"></span></span>

        <sc-for list="{{ spots }}" as="s" hint-placeholder-count="4">

class Component extends DCLogic {
  state = { active: null };

  select(key) { this.setState(s => ({ active: s.active === key ? null : key })); }

  renderVals() {
    const active = this.state.active;
    const spots = DATA.map(d => {
      const on = active === d.key;
      const chipTopPct = parseFloat(d.chip.top);
      const dotYPct = parseFloat(d.dot.y);
      const stemTop = chipTopPct + (on ? 14.6 : 9.4);
      const stemH = Math.max(dotYPct - stemTop, 0);
      return {
        key: d.key, label: d.label, blurb: d.blurb, icon: d.icon,
        onClick: () => this.select(d.key),
        blurbStyle: `font-size:12.5px;line-height:1.45;color:#6B7684;text-wrap:pretty;max-width:170px;display:${on ? 'block' : 'none'};`,
        chipStyle: `position:absolute;left:${d.chip.left};top:${d.chip.top};display:flex;gap:9px;align-items:center;padding:11px 15px 11px 12px;border-radius:14px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border:1px solid ${on ? d.color : 'rgba(229,232,235,.9)'};box-shadow:${on ? '0 14px 32px rgba(25,31,40,.20)' : '0 6px 18px rgba(25,31,40,.12)'};cursor:pointer;font-family:inherit;transition:all .22s cubic-bezier(.2,.8,.2,1);transform:${on ? 'translateY(-2px)' : 'none'};z-index:3;`,
        iconStyle: `flex:none;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;background:${d.color};`,
        stemStyle: `position:absolute;left:${d.dot.x};top:${stemTop}%;height:${stemH}%;width:2px;background:${d.color};opacity:${on ? 1 : .55};transform:translateX(-1px);z-index:2;transition:all .22s cubic-bezier(.2,.8,.2,1);`,
        dotStyle: `position:absolute;left:${d.dot.x};top:${d.dot.y};width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:${d.color};border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.22);z-index:3;`,
        pingStyle: `position:absolute;inset:-2px;border-radius:50%;border:2px solid ${d.color};animation:pin-ping 2.8s ease-out infinite;`
      };
    });

    const ad = DATA.find(d => d.key === active);
    let beam = null;
    if (ad) {
      const ax = 1146, ay = 176;
      const targets = [{ x: parseFloat(ad.dot.x) / 100 * 1400, y: parseFloat(ad.dot.y) / 100 * 890, rx: 62, ry: 24 }];
      if (ad.key === 'cloud') { targets.length = 0; targets.push({ x: 457, y: 256, rx: 166, ry: 160 }); }
      beam = {
        color: ad.key === 'cloud' ? '#5B6E88' : ad.color,
        feet: ad.key === 'cloud' ? [] : targets,
        cones: (() => {
          const l = Math.min(...targets.map(t => t.x - t.rx));
          const r = Math.max(...targets.map(t => t.x + t.rx));
          const yBot = Math.max(...targets.map(t => t.y + t.ry));
          const yTop = Math.min(...targets.map(t => t.y - t.ry));
          const cx = (l + r) / 2, half = (r - l) / 2;
          const wide = yTop < ay - 10;
          return [{
            outer: wide
              ? `${ax - 22},${ay} ${ax + 22},${ay} ${r},${yBot} ${l},${yBot} ${l},${yTop}`
              : `${ax - 22},${ay} ${ax + 22},${ay} ${r},${yBot} ${l},${yBot}`,
            inner: wide
              ? `${ax - 9},${ay} ${ax + 9},${ay} ${cx + half * 0.55},${yBot} ${cx - half * 0.55},${yBot} ${cx - half * 0.55},${yTop + 26}`
              : `${ax - 9},${ay} ${ax + 9},${ay} ${cx + half * 0.42},${yBot} ${cx - half * 0.42},${yBot}`
          }];
        })()
      };
    }

    return {
      spots, beam,
      detail: ad ? {
        ...ad,
        hasImg: !!ad.img,
        isCloud: ad.key === 'cloud',
        isFog: ad.key === 'fog',
        gridStyle: `display:grid;grid-template-columns:1.15fr .85fr;`
      } : null,
      close: () => this.setState({ active: null })
    };
  }
