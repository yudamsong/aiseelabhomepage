<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; letter-spacing:-0.01em; color:#191F28; background:#fff; }
  a { color:inherit; text-decoration:none; }
  a:hover { color:#1B3A6B; }
  .section-h { font-weight:700; color:#191F28; letter-spacing:-0.03em; }
  input::placeholder { color:#B0B8C1; }
  input:focus { outline:none; border-color:#1B3A6B; }
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;">
  <dc-import name="SiteHeader" active="publications" hint-size="100%,82px"></dc-import>
  <main style="flex:1;">

    <section style="max-width:1100px;margin:0 auto;padding:64px 48px 0;">
      <h2 class="section-h" style="font-size:40px;">Publications</h2>
      <p style="margin-top:10px;color:#8B95A1;font-size:16px;">Research Results&nbsp;&nbsp;(*Corresponding Author)</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px;">
        <sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
          <div style="background:#F2F4F6;border-radius:20px;padding:24px 26px;display:flex;flex-direction:column;gap:6px;">
            <span style="font-size:14px;font-weight:600;color:#8B95A1;">{{ s.label }}</span>
            <span class="section-h" style="font-size:32px;">{{ s.value }}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="max-width:1100px;margin:0 auto;padding:56px 48px 0;">
      <h3 class="section-h" style="font-size:22px;margin-bottom:20px;">주요 논문</h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;">
        <sc-for list="{{ highlights }}" as="hl" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;gap:12px;padding:26px 24px;border:1px solid #E5E8EB;border-radius:20px;box-shadow:0 1px 2px rgba(25,31,40,.04);">
            <span style="align-self:flex-start;font-size:13px;font-weight:700;color:#1B3A6B;background:#E7ECF5;border-radius:999px;padding:5px 12px;">{{ hl.year }}</span>
            <span style="font-size:17px;font-weight:700;line-height:1.45;color:#191F28;text-wrap:pretty;">{{ hl.title }}</span>
            <span style="font-size:14px;color:#4E5968;line-height:1.5;">{{ hl.journal }}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="max-width:1100px;margin:0 auto;padding:56px 48px 88px;">
      <div style="position:sticky;top:82px;background:#fff;padding:14px 0 18px;z-index:10;">
        <input type="text" value="{{ query }}" onChange="{{ onSearch }}" placeholder="제목, 저자, 저널로 검색" style="width:100%;height:54px;padding:0 20px;font-size:16px;font-family:inherit;color:#191F28;background:#F2F4F6;border:1px solid #F2F4F6;border-radius:14px;transition:border-color .2s;">
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;">
          <sc-for list="{{ yearChips }}" as="c" hint-placeholder-count="8">
            <span onClick="{{ c.onClick }}" style="{{ c.style }}">{{ c.label }}</span>
          </sc-for>
        </div>
        <div style="margin-top:14px;font-size:14px;color:#8B95A1;">{{ resultLabel }}</div>
      </div>

      <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:36px;margin-top:8px;">
          <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
            <div>
              <div style="display:flex;align-items:baseline;gap:12px;padding-bottom:12px;border-bottom:2px solid #191F28;">
                <span class="section-h" style="font-size:26px;">{{ g.year }}</span>
                <span style="font-size:14px;color:#8B95A1;">{{ g.count }}</span>
              </div>
              <ul style="list-style:none;display:flex;flex-direction:column;">
                <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
                  <li style="display:flex;gap:16px;padding:18px 4px;border-bottom:1px solid #E5E8EB;">
                    <span style="flex-shrink:0;width:30px;font-size:14px;font-weight:700;color:#B0B8C1;padding-top:2px;">{{ it.num }}</span>
                    <span style="flex:1;font-size:15px;line-height:1.7;color:#4E5968;text-wrap:pretty;">{{ it.text }}</span>
                    <sc-if value="{{ it.corr }}" hint-placeholder-val="{{ false }}">
                      <span style="flex-shrink:0;align-self:flex-start;font-size:12px;font-weight:700;color:#1B3A6B;background:#E7ECF5;border-radius:999px;padding:5px 10px;white-space:nowrap;">교신저자</span>
                    </sc-if>
                  </li>
                </sc-for>
              </ul>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:40px;padding:60px 24px;text-align:center;background:#F2F4F6;border-radius:20px;">
          <div style="font-size:17px;font-weight:700;color:#191F28;">검색 결과가 없습니다</div>
          <div style="margin-top:8px;font-size:15px;color:#8B95A1;">다른 키워드나 연도로 다시 찾아보세요.</div>
        </div>
      </sc-if>
    </section>

  </main>
  <dc-import name="SiteFooter" hint-size="100%,90px"></dc-import>
</div>

</template></x-dc>

      ]},
      { year: '2017', items: [
        'K.S. Lee, D. Jin, J.M. Yeom, M. Seo, S. Choi, J.J. Kim, K.S. Han, 2017, New Approach for Snow Cover Detection through Spectral Pattern Recognition with MODIS Data. Journal of Sensors, 2017, 15.',
        'H.W. Kim, J.M. Yeom*, D.G. Shin, S.W. Choi, K.S. Han, J.L. Roujean, 2017, An assessment of thin cloud detection by applying BRDF model-based background surface reflectance using GOCI: a case study for South Korea. Journal of Geophysical Research: Atmospheres, 122.',
        'C.S. Lee, K.S. Han, J.M. Yeom, K. Lee, M. Seo, J. Hong, J.W. Hong, K. Lee, J. Shin, I. Chul S., J. Chun, J.L. Roujean, 2017, Surface albedo from the geostationary COMS/Meteorological Imager (MI) observation system. GIScience & Remote Sensing, 55.',
        'D.W. Kim, R.C. Deo, J.S. Lee, J.M. Yeom, 2017, Mapping heatwave vulnerability in Korea. Natural Hazards, 89.',
        'J.M. Yeom, R.C. Deo, J.H. Chun, J.K. Hong, D.S. Kim, K.S. Han, J.I. Cho, 2017, Synthetic retrieval of hourly net ecosystem exchange using the neural network model with combined MI and GOCI geostationary sensor datasets and ground-based measurements. International Journal of Remote Sensing, 38.',
        'J.M. Yeom, J.S. Hwang, J.H. Jung, K.H. Lee, C.S. Lee, 2017, Initial radiometric characteristics of KOMPSAT-3A multispectral imagery using the 6S radiative transfer model, well-known radiometric tarps, and MFRSR measurements. Remote Sensing, 9(130).',
        'M. Kim, J. Ko, S. Jeong, J.M. Yeom, H. Kim, 2017, Monitoring canopy growth and grain yield of paddy rice in South Korea by using the GRAMI model and high spatial resolution imagery. GIScience & Remote Sensing.'
      ]},
      { year: '2016', items: [

      { year: '2015', items: [
        'J.M. Yeom, H.O. Kim, 2015, Comparison of NDVIs from GOCI and MODIS Data towards Improved Assessment of Crop Temporal Dynamics in the Case of Paddy Rice. Remote Sensing, 7, 113-11343.',
        'J.M. Yeom, J.H. Ko, H.O. Kim, 2015, Application of GOCI-derived vegetation index profiles to estimation of paddy rice yield using the GRAMI rice model. Computers and Electronics in Agriculture, 118, 1-8.',
        'K.S. Han, Y.Y. Park, J.M. Yeom*, 2015, Detection of Change in Vegetation in the Surrounding Desert Areas of Northwest China and Mongolia with Multi-Temporal Satellite Images. Asia-Pacific Journal of Atmospheric Science, 51(2), 173-181.',

        'H.O. Kim, J.M. Yeom*, 2015, Sensitivity of vegetation indices to spatial degradation of RapidEye imagery for paddy rice detection: a case study of South Korea. GIScience & Remote Sensing, 52(1), 1-17.',

      { year: '2013', items: [

      { year: '2012', items: [

      { year: '2010', items: [

      { year: '2009', items: [

      ]},
      { year: '2008', items: [
        'J.M. Yeom, K.S. Han, Y.S. Kim, J.D. Jang, 2008, Neural network determination of cloud attenuation to estimate insolation using MTSAT-1R data. International Journal of Remote Sensing, 29(21), 6193-6208.'
      ]}

    const total = byYear.reduce((n, g) => n + g.items.length, 0);
    const corrTotal = byYear.reduce((n, g) => n + g.items.filter(t => t.indexOf('Yeom*') !== -1).length, 0);

    const q = (this.state.query || '').trim().toLowerCase();
    const yr = this.state.year;
    const groups = byYear
      .filter(g => yr === 'All' || g.year === yr)
      .map(g => {
        const items = g.items.filter(t => !q || t.toLowerCase().indexOf(q) !== -1);
        return { year: g.year, count: items.length + '편', items: items.map((t, i) => ({ num: String(i + 1).padStart(2, '0'), text: t, corr: t.indexOf('Yeom*') !== -1 })) };
      })
      .filter(g => g.items.length);
    const shown = groups.reduce((n, g) => n + g.items.length, 0);

    const chipStyle = (on) => 'padding:9px 16px;border-radius:999px;font-size:14px;cursor:pointer;user-select:none;transition:background .2s,color .2s;' + (on ? 'font-weight:700;color:#fff;background:#1B3A6B;' : 'font-weight:600;color:#4E5968;background:#F2F4F6;');
    const chip = (label) => ({ label, style: chipStyle(yr === label), onClick: () => this.setState({ year: label }) });

    return {
      stats: [
        { label: '전체 논문', value: total + '편' },
        { label: '교신저자 논문', value: corrTotal + '편' },
        { label: '연구 기간', value: '2008 – 2026' }
      ],
      highlights: [
        { year: '2026', title: 'Utilizing deep learning techniques in operational system of geo-KOMPSAT-2A satellite for estimating solar radiation and aerosol optical depth', journal: 'GIScience & Remote Sensing, 62(1)' },
        { year: '2026', title: 'Spatiotemporal attention with conditional feature modulation for satellite-based solar irradiance prediction', journal: 'IEEE Geoscience and Remote Sensing Letters, 23' },
        { year: '2025', title: 'Evaluation of Cloud Mask Performance of KOMPSAT-3 Top-of-Atmosphere Reflectance Incorporating Deeplabv3+ with Resnet 101 Model', journal: 'Applied Sciences, 15(8)' }
      ],
      query: this.state.query,
      onSearch: (e) => this.setState({ query: e.target.value }),
      yearChips: [chip('All')].concat(byYear.map(g => chip(g.year))),
      groups,
      hasResults: groups.length > 0,
      noResults: groups.length === 0,
      resultLabel: shown + '편의 논문'
    };
  }
}
</script>
</body>
</html>
